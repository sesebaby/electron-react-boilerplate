<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下拉框主题测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
        }
        
        /* 玻璃未来风主题 */
        [data-theme="glass-future"] {
            background: linear-gradient(135deg, oklch(0.585 0.233 277.117) 0%, oklch(0.511 0.262 276.966) 100%);
        }
        
        /* 深色科技风主题 */
        [data-theme="dark-tech"] {
            background: linear-gradient(135deg, oklch(0.208 0.042 265.755) 0%, oklch(0.279 0.041 260.031) 100%);
        }
        
        /* 温暖商务风主题 */
        [data-theme="warm-business"] {
            background: linear-gradient(135deg, oklch(0.828 0.189 84.429) 0%, oklch(0.769 0.188 70.08) 100%);
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .theme-selector {
            margin-bottom: 30px;
            text-align: center;
        }
        
        .theme-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            margin: 0 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .theme-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        
        .required::after {
            content: " *";
            color: rgb(248, 113, 113);
        }
        
        .glass-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            appearance: none;
            cursor: pointer;
        }
        
        .glass-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }
        
        /* 玻璃未来风主题下拉框样式 */
        [data-theme="glass-future"] .glass-select {
            background: oklch(0.511 0.262 276.966 / 0.9);
            backdrop-filter: blur(35px);
            border: 1px solid oklch(0.87 0.065 274.039 / 0.6);
            color: oklch(100% 0.00011 271.152 / 0.945);
            text-shadow: 0 2px 8px oklch(0.257 0.09 281.288 / 0.8);
            box-shadow: 0 25px 80px oklch(0.257 0.09 281.288 / 0.4);
        }
        
        [data-theme="glass-future"] .glass-select:focus,
        [data-theme="glass-future"] .glass-select:hover {
            background: oklch(0.457 0.24 277.023 / 0.95);
            border-color: oklch(0.785 0.115 274.713 / 0.7);
        }
        
        [data-theme="glass-future"] .glass-select option {
            background: oklch(0.511 0.262 276.966 / 0.95) !important;
            color: oklch(100% 0.00011 271.152 / 0.945) !important;
            padding: 8px 12px;
            border: none;
            font-weight: 500;
        }
        
        [data-theme="glass-future"] .glass-select option:checked,
        [data-theme="glass-future"] .glass-select option:hover {
            background: oklch(0.457 0.24 277.023 / 0.98) !important;
            color: oklch(100% 0.00011 271.152) !important;
        }
        
        /* 深色科技风主题下拉框样式 */
        [data-theme="dark-tech"] .glass-select {
            background: oklch(0.279 0.041 260.031 / 0.85);
            border: 1px solid oklch(0.446 0.043 257.281 / 0.3);
            color: oklch(0.968 0.007 247.896);
            text-shadow: 0 1px 3px oklch(0.129 0.042 264.695 / 0.8);
        }
        
        [data-theme="dark-tech"] .glass-select:focus,
        [data-theme="dark-tech"] .glass-select:hover {
            background: oklch(0.372 0.044 257.287 / 0.9);
            border-color: oklch(0.554 0.046 257.417 / 0.5);
        }
        
        [data-theme="dark-tech"] .glass-select option {
            background: oklch(0.279 0.041 260.031 / 0.95) !important;
            color: oklch(0.968 0.007 247.896) !important;
            padding: 8px 12px;
            border: none;
            font-weight: 500;
        }
        
        [data-theme="dark-tech"] .glass-select option:checked,
        [data-theme="dark-tech"] .glass-select option:hover {
            background: oklch(0.372 0.044 257.287 / 0.98) !important;
            color: oklch(0.968 0.007 247.896) !important;
        }
        
        /* 温暖商务风主题下拉框样式 */
        [data-theme="warm-business"] .glass-select {
            background: oklch(0.987 0.022 95.277 / 0.85);
            border: 1px solid oklch(0.924 0.12 95.746 / 0.4);
            color: oklch(0.414 0.112 45.904);
            text-shadow: 0 1px 3px oklch(0.987 0.022 95.277 / 0.9);
        }
        
        [data-theme="warm-business"] .glass-select:focus,
        [data-theme="warm-business"] .glass-select:hover {
            background: oklch(0.962 0.059 95.617 / 0.5);
            border-color: oklch(0.879 0.169 91.605 / 0.6);
        }
        
        [data-theme="warm-business"] .glass-select option {
            background: oklch(0.987 0.022 95.277 / 0.95) !important;
            color: oklch(0.414 0.112 45.904) !important;
            padding: 8px 12px;
            border: none;
            font-weight: 500;
        }
        
        [data-theme="warm-business"] .glass-select option:checked,
        [data-theme="warm-business"] .glass-select option:hover {
            background: oklch(0.962 0.059 95.617 / 0.98) !important;
            color: oklch(0.414 0.112 45.904) !important;
        }
        
        .test-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .test-info h3 {
            margin-top: 0;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .test-info ul {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }
    </style>
</head>
<body data-theme="glass-future">
    <div class="container">
        <h1>下拉框主题测试</h1>
        
        <div class="theme-selector">
            <button class="theme-btn active" onclick="changeTheme('glass-future')">玻璃未来风</button>
            <button class="theme-btn" onclick="changeTheme('dark-tech')">深色科技风</button>
            <button class="theme-btn" onclick="changeTheme('warm-business')">温暖商务风</button>
        </div>
        
        <div class="form-group">
            <label for="status" class="label required">订单状态</label>
            <select id="status" class="glass-input glass-select">
                <option value="">请选择状态</option>
                <option value="draft">草稿</option>
                <option value="pending">待处理</option>
                <option value="confirmed">已确认</option>
                <option value="shipped">已发货</option>
                <option value="delivered">已交付</option>
                <option value="cancelled">已取消</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="payment" class="label required">支付状态</label>
            <select id="payment" class="glass-input glass-select">
                <option value="">请选择支付状态</option>
                <option value="unpaid">未支付</option>
                <option value="partial">部分支付</option>
                <option value="paid">已支付</option>
                <option value="refunded">已退款</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="category" class="label required">商品分类</label>
            <select id="category" class="glass-input glass-select">
                <option value="">请选择分类</option>
                <option value="electronics">电子产品</option>
                <option value="clothing">服装</option>
                <option value="food">食品</option>
                <option value="books">图书</option>
                <option value="home">家居用品</option>
                <option value="sports">运动器材</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="role" class="label required">用户角色</label>
            <select id="role" class="glass-input glass-select">
                <option value="">请选择角色</option>
                <option value="admin">管理员</option>
                <option value="operator">操作员</option>
                <option value="viewer">查看者</option>
            </select>
        </div>
        
        <div class="test-info">
            <h3>测试说明：</h3>
            <ul>
                <li>点击上方按钮切换不同主题</li>
                <li>检查下拉框的背景色、边框色、文字色是否匹配主题</li>
                <li>检查下拉框选项的颜色是否正确</li>
                <li>测试悬停和聚焦效果</li>
                <li>确认所有主题下的可读性</li>
            </ul>
        </div>
    </div>
    
    <script>
        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            
            // 更新按钮状态
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 应用主题背景
            const themeColors = {
                'glass-future': 'linear-gradient(135deg, oklch(0.585 0.233 277.117) 0%, oklch(0.511 0.262 276.966) 100%)',
                'dark-tech': 'linear-gradient(135deg, oklch(0.208 0.042 265.755) 0%, oklch(0.279 0.041 260.031) 100%)',
                'warm-business': 'linear-gradient(135deg, oklch(0.828 0.189 84.429) 0%, oklch(0.769 0.188 70.08) 100%)'
            };
            document.body.style.background = themeColors[theme];
        }
        
        // 初始化主题
        changeTheme('glass-future');
    </script>
</body>
</html>
